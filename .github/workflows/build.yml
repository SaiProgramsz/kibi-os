name: Build Kibi OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            dosfstools \
            mtools

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build Kibi OS
        run: ./build.sh

      - name: Show build output
        run: |
          echo "=== Build output ==="
          ls -lah

          echo "=== ISO files ==="
          find . -maxdepth 1 -type f -name "*.iso" -ls

          echo "=== Checksums ==="
          cat SHA256SUMS

      - name: Upload Kibi OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: Kibi-OS
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error